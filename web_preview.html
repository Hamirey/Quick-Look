<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Look - Viral News</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-black: #000000;
      --tiktok-green: #00E676;
      --tiktok-red: #FE2C55;
      --text-main: #FFFFFF;
      --text-sub: rgba(255, 255, 255, 0.85);
      --text-dim: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #020305;
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* TikTok Mobile Frame */
    .app-viewport {
      width: 100%;
      max-width: 415px;
      height: 100%;
      max-height: 890px;
      position: relative;
      background: var(--bg-black);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 36px;
        height: 94vh;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.98);
      }
    }

    /* Top Floating Header */
    .app-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      padding: 16px 16px 8px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 80%, transparent 100%);
      pointer-events: auto;
    }
    
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .app-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
    }
    
    .app-brand-badge {
      background: var(--tiktok-green);
      color: #000;
      font-weight: 900;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
    }
    
    .refresh-btn {
      background: transparent;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      opacity: 0.85;
      transition: transform 0.2s;
    }
    .refresh-btn:hover {
      opacity: 1;
      transform: rotate(90deg);
    }

    /* Category Filter Pills (TikTok Glass Style) */
    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    
    .cat-pill {
      padding: 5px 12px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    
    .cat-pill.active {
      background: var(--tiktok-green);
      color: #000000;
      border-color: var(--tiktok-green);
      font-weight: 800;
    }

    /* Vertical Feed */
    .feed-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }

    /* Post Card Item */
    .post-card {
      width: 100%;
      height: 100%;
      position: relative;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-black);
      overflow: hidden;
    }

    .media-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* TikTok Vignette */
    .gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.6) 0%,
        transparent 20%,
        transparent 60%,
        rgba(0, 0, 0, 0.88) 100%
      );
      z-index: 2;
      pointer-events: none;
    }

    /* Bottom-Left Overlay Content */
    .post-content {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 76px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      width: fit-content;
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid rgba(0, 230, 118, 0.4);
      color: var(--tiktok-green);
    }
    
    .badge-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--tiktok-green);
    }

    .post-author {
      font-size: 15.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      cursor: pointer;
      color: #fff;
    }
    
    .verified-icon {
      color: var(--tiktok-green);
      font-size: 13px;
    }

    .post-caption {
      font-size: 13.5px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .post-caption.expanded {
      -webkit-line-clamp: unset;
    }

    .thread-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      width: fit-content;
      margin-top: 2px;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }
    .thread-link-btn:hover {
      background: rgba(0, 230, 118, 0.2);
      border-color: var(--tiktok-green);
      color: #fff;
    }

    /* -------------------------------------------------------------
       TIKTOK / INSTAGRAM REELS NATIVE ACTION TOOLBAR
       Clean floating white vector icons without colored backgrounds
       ------------------------------------------------------------- */
    .action-toolbar {
      position: absolute;
      right: 10px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
    }

    .action-icon-svg {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    
    .action-icon-svg svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.2s ease;
    }

    .action-item:hover .action-icon-svg {
      transform: scale(1.15);
    }
    
    /* Liked Heart (Filled Red or Green like TikTok) */
    .action-item.liked .action-icon-svg svg {
      fill: var(--tiktok-green);
      stroke: var(--tiktok-green);
      animation: heartBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Disliked Icon — stays white like TikTok (no color change) */
    .action-item.disliked .action-icon-svg svg {
      stroke: #FFFFFF;
    }

    .action-label {
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      letter-spacing: -0.2px;
    }

    @keyframes heartBounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* Safety Dropdown Popover */
    .safety-menu-popover {
      position: absolute;
      right: 48px;
      top: -12px;
      background: rgba(14, 16, 22, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.9);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85) translateX(8px);
      transform-origin: right center;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 30;
      width: 130px;
    }
    
    .safety-menu-popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateX(0);
    }

    .safety-sub-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .safety-sub-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .safety-sub-btn.report-btn { color: #FF453A; }
    .safety-sub-btn.block-btn { color: #FF9F0A; }

    /* Quote Fallback */
    .quote-card-body {
      padding: 32px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background: radial-gradient(circle at center, #101520 0%, #030406 100%);
    }
    .quote-icon {
      font-size: 38px;
      opacity: 0.3;
      margin-bottom: 12px;
      color: var(--tiktok-green);
    }
    .quote-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.92);
    }

    /* Comments Modal */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    
    .comments-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 72%;
      background: #0D1017;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px 24px 0 0;
      z-index: 45;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .comments-sheet.open { transform: translateY(0); }
    
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      margin: 10px auto 4px;
    }
    
    .sheet-header {
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 700;
      font-size: 15px;
    }
    
    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    .comment-item { display: flex; gap: 12px; }
    
    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00E676 0%, #00B0FF 100%);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      flex-shrink: 0;
    }
    
    .comment-body { flex: 1; }
    .comment-author { font-size: 12.5px; font-weight: 700; color: rgba(255, 255, 255, 0.9); margin-bottom: 2px; }
    .comment-text { font-size: 13px; color: rgba(255, 255, 255, 0.8); line-height: 1.35; }
    
    .comment-input-bar {
      padding: 12px 16px;
      background: #131722;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
    }
    
    .comment-input {
      flex: 1;
      background: #1C2230;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 10px 16px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }
    .comment-input:focus { border-color: var(--tiktok-green); }
    
    .send-btn {
      background: var(--tiktok-green);
      border: none;
      color: #000;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    /* Report Modal Dialog */
    .report-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 90%;
      max-width: 330px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 18px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.95);
    }
    .report-modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .report-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; color: #FF453A; }
    .report-options { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .report-opt-btn { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 12.5px; text-align: left; cursor: pointer; }
    .report-opt-btn:hover { background: rgba(255, 69, 58, 0.2); border-color: #FF453A; }
    .report-cancel-btn { width: 100%; padding: 8px; border-radius: 8px; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-sub); font-size: 12.5px; cursor: pointer; }
  </style>
</head>

  <div class="app-viewport">

    <header class="app-header">
      <div class="header-top">
        <div class="app-brand">
          <span class="app-brand-badge">⚡</span>
          <span>Quick Look</span>
        </div>
        <button class="refresh-btn" onclick="loadPosts()" title="Refresh Feed">↻</button>
      </div>
      <!-- Category Pills -->
      <nav class="category-bar">
        <button class="cat-pill active" onclick="setCategory('All', this)">All News</button>
        <button class="cat-pill" onclick="setCategory('Afrobeats', this)">🎵 Afrobeats</button>
        <button class="cat-pill" onclick="setCategory('Nollywood', this)">🎬 Nollywood</button>

        <button class="send-btn" onclick="submitComment()">➤</button>
      </div>
    </div>

    <!-- Report Modal Dialog -->
    <div class="report-modal" id="reportModal">
      <div class="report-title">

        <span>Report Post</span>

      <div style="font-size:12px;color:var(--text-sub);margin-bottom:10px;">Select a reason for review:</div>

        <button class="report-opt-btn" onclick="submitReport('Explicit or Graphic Media')">🔞 Explicit or Violent Media</button>
        <button class="report-opt-btn" onclick="submitReport('Spam or Financial Scam')">🎣 Spam, Scam or Fraud</button>
      </div>
      <button class="report-cancel-btn" onclick="closeReportModal()">Cancel</button>
    </div>
  </div>

    async function loadPosts() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('viral_tweets')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data && data.length > 0) {
            allPosts = data;
          } else {
            allPosts = [...REAL_VIRAL_POSTS];
          }
        } catch (e) {
          allPosts = [...REAL_VIRAL_POSTS];
        }
      } else {
        allPosts = [...REAL_VIRAL_POSTS];
      }

      renderFeed();
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      const filtered = allPosts
        .filter(p => !blockedAuthors.has((p.author || '').toLowerCase()))
        .filter(p => currentCategory === 'All' || (p.category && p.category.toLowerCase() === currentCategory.toLowerCase()));

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,0.7);text-align:center;padding:24px;';
        empty.innerHTML = `
          <div style="font-size:38px;">⚡</div>
          <div style="font-weight:700;font-size:16px;">No posts in ${currentCategory} yet</div>
          <button class="cat-pill active" style="margin-top:10px;" onclick="setCategory('All', document.querySelector('.cat-pill'))">Explore All News</button>
        `;
        feed.appendChild(empty);
        return;
      }

      filtered.forEach((post) => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.id = `card-${post.tweet_id}`;

        const canonicalX = post.x_url || `https://x.com/${(post.author || '').replace('@','')}/status/${post.tweet_id}`;
        const authorHandle = post.author && post.author.startsWith('@') ? post.author : '@' + (post.author || 'Creator');
        const reaction = userReactions[post.tweet_id] || null;

        card.innerHTML = `
          ${post.media_url ? `
            <img class="media-layer" src="${post.media_url}" alt="Viral media" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="quote-card-body" style="display:none;position:absolute;top:0;left:0;">
              <div class="quote-icon">❝</div>
              <div class="quote-title">${escapeHtml(post.caption || 'Viral Nigerian Update')}</div>
            </div>
          ` : `
            <div class="quote-card-body">
              <div class="quote-icon">❝</div>
              <div class="quote-title">${escapeHtml(post.caption || 'Viral Nigerian Update')}</div>
            </div>
          `}

          <div class="gradient-overlay"></div>

          <!-- Bottom Left Overlay -->
          <div class="post-content">
            <div class="category-badge">
              <span class="badge-dot"></span>
              <span>${escapeHtml(post.category || 'Viral')}</span>
            </div>
            <div class="post-author" onclick="window.open('${canonicalX}', '_blank')">
              <span>${escapeHtml(authorHandle)}</span>
              <span class="verified-icon">✓</span>
            </div>
            <div class="post-caption" onclick="this.classList.toggle('expanded')">${escapeHtml(post.caption || '')}</div>
            <a href="${canonicalX}" target="_blank" class="thread-link-btn">🔗 Read thread on X</a>
          </div>

          <!-- Right Action Toolbar (TIKTOK / INSTAGRAM REELS NATIVE STYLE) -->
          <div class="action-toolbar">
            
            <!-- TikTok Like Heart Icon -->
            <div class="action-item ${reaction === 'like' ? 'liked' : ''}" id="item-like-${post.tweet_id}" onclick="handleLike('${post.tweet_id}')">
              <div class="action-icon-svg">
                <svg viewBox="0 0 24 24">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>

              </div>

            <!-- TikTok Dislike Thumbs Icon -->
            <div class="action-item ${reaction === 'dislike' ? 'disliked' : ''}" id="item-dislike-${post.tweet_id}" onclick="handleDislike('${post.tweet_id}')">

                <svg viewBox="0 0 24 24">
                  <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4.33v7.34A2.31 2.31 0 0 1 19.67 14H17"></path>

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Mutual Exclusion: Like vs Dislike
    function handleLike(tweetId) {
      let post = allPosts.find(p => p.tweet_id === tweetId);
      if (!post) return;

      const likeItem = document.getElementById(`item-like-${tweetId}`);
      const dislikeItem = document.getElementById(`item-dislike-${tweetId}`);
      const likeCountEl = document.getElementById(`like-count-${tweetId}`);
      const dislikeCountEl = document.getElementById(`dislike-count-${tweetId}`);

      const currentReaction = userReactions[tweetId];

      if (currentReaction === 'like') {
        userReactions[tweetId] = null;
        post.app_likes = Math.max(0, (post.app_likes || 1) - 1);
        if (likeItem) likeItem.classList.remove('liked');
      } else {
        if (currentReaction === 'dislike') {
          post.app_dislikes = Math.max(0, (post.app_dislikes || 1) - 1);
          if (dislikeItem) dislikeItem.classList.remove('disliked');
          if (dislikeCountEl) dislikeCountEl.innerText = formatNumber(post.app_dislikes);
        }

        userReactions[tweetId] = 'like';
        post.app_likes = (post.app_likes || 0) + 1;
        if (likeItem) likeItem.classList.add('liked');
      }

      if (likeCountEl) likeCountEl.innerText = formatNumber(post.app_likes);

      if (supabaseClient) {
        supabaseClient.from('viral_tweets').update({ 
          app_likes: post.app_likes,
          app_dislikes: post.app_dislikes 
        }).eq('tweet_id', tweetId);
      }
    }

      const likeItem = document.getElementById(`item-like-${tweetId}`);

      } else {

          if (likeItem) likeItem.classList.remove('liked');
          if (likeCountEl) likeCountEl.innerText = formatNumber(post.app_likes);

      }

      if (dislikeCountEl) dislikeCountEl.innerText = formatNumber(post.app_dislikes);

      if (supabaseClient) {

    }

    function handleShare(tweetId) {
      const post = allPosts.find(p => p.tweet_id === tweetId);
      if (!post) return;
      const canonicalX = post.x_url || `https://x.com/${(post.author || '').replace('@','')}/status/${post.tweet_id}`;
      const text = `🔥 *Viral on Quick Look [${post.category}]*\n\n"${post.caption}"\n\n👉 Read discussion on X:\n${canonicalX}`;

      if (navigator.share) {
        navigator.share({ title: 'Quick Look Viral News', text: text });
      } else {
        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
        window.open(waUrl, '_blank');
      }
    }

    function toggleSafetyDropdown(tweetId) {
      const allPopovers = document.querySelectorAll('.safety-menu-popover');
      allPopovers.forEach(pop => {
        if (pop.id !== `safety-pop-${tweetId}`) {
          pop.classList.remove('open');
        }
      });
      const targetPop = document.getElementById(`safety-pop-${tweetId}`);
      if (targetPop) {
        targetPop.classList.toggle('open');
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.action-item')) {
        document.querySelectorAll('.safety-menu-popover').forEach(p => p.classList.remove('open'));
      }
    });

    function openReportModal(tweetId) {
      reportingTweetId = tweetId;
      document.querySelectorAll('.safety-menu-popover').forEach(p => p.classList.remove('open'));
      document.getElementById('reportModal').classList.add('open');
      document.getElementById('commentsOverlay').classList.add('open');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.remove('open');
      document.getElementById('commentsOverlay').classList.remove('open');
    }

    function submitReport(reason) {
      closeReportModal();
      if (supabaseClient && reportingTweetId) {
        supabaseClient.from('content_reports').insert({ tweet_id: reportingTweetId, reason: reason, status: 'pending' });
      }
      alert(`✅ Post reported for "${reason}". Our moderation team will review it.`);
    }

    function blockAuthor(author) {
      document.querySelectorAll('.safety-menu-popover').forEach(p => p.classList.remove('open'));
      blockedAuthors.add((author || '').toLowerCase());

      if (supabaseClient) {
        supabaseClient.from('blocked_users').insert({ blocked_handle: author });
      }

      renderFeed();
      alert(`🚫 @${author} has been blocked and removed from your feed.`);
    }

    // Comments Sheet
    async function openComments(tweetId) {
      activeTweetId = tweetId;
      document.getElementById('commentsOverlay').classList.add('open');
      document.getElementById('commentsSheet').classList.add('open');
      const list = document.getElementById('commentsList');
      list.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;">Loading comments...</div>';

      let comments = localCommentsMap[tweetId] || [];

      if (supabaseClient) {
        try {
          const { data } = await supabaseClient
            .from('app_comments')
            .select('*')
            .eq('tweet_id', tweetId)
            .order('created_at', { ascending: true });
          if (data && data.length > 0) comments = data;
        } catch (e) {}
      }

      renderCommentsList(comments);
    }

    function renderCommentsList(comments) {
      const list = document.getElementById('commentsList');
      if (comments.length === 0) {
        list.innerHTML = `
          <div style="text-align:center;padding:30px;color:var(--text-dim);">
            <div style="font-size:32px;margin-bottom:8px;">💬</div>
            <div>No comments yet. Start the conversation!</div>
          </div>
        `;
      } else {
        list.innerHTML = '';
        comments.forEach(c => {
          const item = document.createElement('div');
          item.className = 'comment-item';
          const initial = (c.author_name || 'A')[0].toUpperCase();
          item.innerHTML = `
            <div class="comment-avatar">${initial}</div>
            <div class="comment-body">
              <div class="comment-author">${escapeHtml(c.author_name || 'Anonymous')}</div>
              <div class="comment-text">${escapeHtml(c.comment_text || '')}</div>
            </div>
          `;
          list.appendChild(item);
        });
      }
      document.getElementById('commentsCountHeader').innerText = `${comments.length} Comments`;
    }

    function closeComments() {
      document.getElementById('commentsOverlay').classList.remove('open');
      document.getElementById('commentsSheet').classList.remove('open');
      closeReportModal();
    }

    async function submitComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text || !activeTweetId) return;

      const newComment = {
        tweet_id: activeTweetId,
        author_name: 'GuestUser',
        comment_text: text
      };

      if (!localCommentsMap[activeTweetId]) {
        localCommentsMap[activeTweetId] = [];
      }
      localCommentsMap[activeTweetId].push(newComment);

      if (supabaseClient) {
        try {
          await supabaseClient.from('app_comments').insert(newComment);
        } catch (e) {}
      }

      const post = allPosts.find(p => p.tweet_id === activeTweetId);
      if (post) {
        post.app_comments_count = (post.app_comments_count || 0) + 1;
        const countEl = document.getElementById(`comm-count-${activeTweetId}`);
        if (countEl) countEl.innerText = formatNumber(post.app_comments_count);
      }

      input.value = '';
      renderCommentsList(localCommentsMap[activeTweetId]);
    }

    // Initialize
    loadPosts();
  </script>
</body>
</html>
